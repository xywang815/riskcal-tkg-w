# Fast CUDA sanity check for the fixed scorer.
# This is not a paper-facing confirmatory run; use it before the full server run.
seed: 17
seeds: [17]
device: cuda
data_mode: icews14
data_path: data/raw/icews14
output_root: results
target_coverage: 0.9
deletion_rates: [0.0]
train_fraction: 0.6
calibration_fraction: 0.2
calibration_role_fractions: [0.25, 0.30, 0.15, 0.30]
rolling_window: 1000
half_lives: [7.0, 14.0, 30.0, .inf]
adaptive_selector_ridge: 1.0
adaptive_coverage_tolerance: 0.02
max_set_sizes: [1, 3, 5, 10, 20, 50]
embedding_dim: 128
epochs: 30
batch_size: 1024
negatives: 64
training_margin: 1.0
learning_rate: 0.003
weight_decay: 0.0
eval_every: 2
patience: 5
min_score_std: 1e-10
