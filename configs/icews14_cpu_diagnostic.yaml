# Full-data, low-budget CPU diagnostic.  This configuration is intentionally
# non-confirmatory: it exercises all ICEWS14 queries but does not provide the
# model capacity, optimization budget, seed count, or baseline breadth required
# for the paper's final claims.
seed: 17
seeds: [17, 29, 43]
device: cpu
data_mode: icews14
data_path: data/raw/icews14
output_root: results
target_coverage: 0.9
deletion_rates: [0.0, 0.3]
train_fraction: 0.6
calibration_fraction: 0.2
calibration_role_fractions: [0.25, 0.30, 0.15, 0.30]
rolling_window: 1000
half_lives: [7.0, 14.0, 30.0, .inf]
adaptive_selector_ridge: 1.0
adaptive_coverage_tolerance: 0.02
max_set_sizes: [1, 3, 5, 10, 20, 50]
embedding_dim: 16
epochs: 3
batch_size: 256
negatives: 4
training_margin: 1.0
learning_rate: 0.001
weight_decay: 0.000001
eval_every: 1
patience: 2
min_score_std: 0.0
